<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34226E"/>
      <stop offset="1" stop-color="#140C33"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="1" x2="1" y2="0.15">
      <stop offset="0" stop-color="#E0815F"/>
      <stop offset="0.5" stop-color="#D2694A"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#5B9BFF"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4573A"/>
      <stop offset="0.5" stop-color="#B4573A"/>
      <stop offset="0.5" stop-color="#2A62C8"/>
      <stop offset="1" stop-color="#2A62C8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="1" stop-color="#DCD6EA"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- arka plan -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- telepati halkaları -->
    <circle cx="512" cy="676" r="300" fill="none" stroke="#7FF3FF" stroke-opacity="0.10" stroke-width="10"/>
    <circle cx="512" cy="676" r="370" fill="none" stroke="#7FF3FF" stroke-opacity="0.06" stroke-width="10"/>

    <!-- arka plan yıldızları -->
    <g fill="#FFF4D6">
      <path d="M220 260 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" opacity="0.8"/>
      <path d="M800 300 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.6"/>
      <path d="M770 820 l7 19 19 7 -19 7 -7 19 -7 -19 -19 -7 19 -7z" opacity="0.5"/>
      <circle cx="300" cy="420" r="5" opacity="0.6"/>
      <circle cx="740" cy="460" r="4" opacity="0.5"/>
      <circle cx="210" cy="760" r="5" opacity="0.4"/>
      <circle cx="840" cy="620" r="4" opacity="0.5"/>
    </g>
  </g>

  <g transform="translate(0 36)">
  <!-- yan cıvatalar -->
  <circle cx="292" cy="652" r="30" fill="#BDB6D6"/>
  <circle cx="732" cy="652" r="30" fill="#BDB6D6"/>

  <!-- kafa -->
  <rect x="306" y="512" width="412" height="282" rx="92" fill="url(#head)"/>
  <!-- vizör -->
  <rect x="352" y="566" width="320" height="168" rx="72" fill="#16132A"/>
  <!-- göz parıltısı -->
  <rect x="424" y="604" width="64" height="100" rx="32" fill="#7FF3FF" opacity="0.18"/>
  <rect x="536" y="604" width="64" height="100" rx="32" fill="#7FF3FF" opacity="0.18"/>
  <!-- gözler -->
  <rect x="432" y="612" width="48" height="84" rx="24" fill="#8FF6FF"/>
  <rect x="544" y="612" width="48" height="84" rx="24" fill="#8FF6FF"/>

  <!-- şapka konisi -->
  <path d="M330 512 Q 452 400 600 162 Q 640 330 694 512 Z" fill="url(#hat)"/>
  <!-- şapka yıldızı -->
  <path d="M528 360 l12 32 32 12 -32 12 -12 32 -12 -32 -32 -12 32 -12z" fill="#FFF4D6"/>
  <!-- şapka siperi -->
  <ellipse cx="512" cy="512" rx="262" ry="44" fill="url(#brim)"/>

  <!-- uçtaki küre -->
  <circle cx="600" cy="160" r="70" fill="#FFE07A" opacity="0.12"/>
  <circle cx="600" cy="160" r="58" fill="#FFE07A" opacity="0.22"/>
  <circle cx="600" cy="160" r="34" fill="#FFE07A"/>
  <circle cx="590" cy="150" r="10" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
