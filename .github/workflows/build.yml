name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swift --version
      - name: Uygulamayı derle (ikon ve imza dahil)
        run: |
          chmod +x scripts/*.sh
          scripts/build-app.sh
          test -f build/TelepAIth.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/TelepAIth.app/Contents/Info.plist
