name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift sürümü
        run: swift --version
      - name: Testler
        run: swift test
      - name: Uygulamayı derle (ikon ve imza dahil)
        run: |
          chmod +x scripts/*.sh
          scripts/build-app.sh
          test -f build/TelepAIth.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/TelepAIth.app/Contents/Info.plist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Çekirdek testleri
        run: dotnet run --project windows/TelepAIth.Core.Tests -c Release
      - name: Uygulamayı derle
        run: dotnet build windows/TelepAIth/TelepAIth.csproj -c Release
      - name: Hook yardımcısı (Native AOT)
        shell: pwsh
        run: |
          dotnet publish windows/TelepAIthHook/TelepAIthHook.csproj -c Release -r win-x64 -p:PublishAot=true -o out/hook
          if ($LASTEXITCODE -ne 0) { exit 1 }
          '{"hook_event_name":"Stop","session_id":"ci"}' | ./out/hook/TelepAIthHook.exe hook claude
          ./out/hook/TelepAIthHook.exe shield
          Get-Item out/hook/TelepAIthHook.exe | Select-Object Name, Length
      - name: Paket (sürümdeki gibi, klasör düzeni)
        shell: pwsh
        run: |
          dotnet publish windows/TelepAIth/TelepAIth.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o out/pkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in @("TelepAIth.exe", "TelepAIth.dll", "TelepAIth.Core.dll", "TelepAIth.deps.json", "TelepAIth.runtimeconfig.json", "System.Private.CoreLib.dll", "PresentationFramework.dll")) {
            if (-not (Test-Path (Join-Path out/pkg $f))) { Write-Host "Eksik: $f"; exit 1 }
          }
          $size = (Get-ChildItem out/pkg -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Paket: {0:N1} MB, {1} dosya" -f $size, (Get-ChildItem out/pkg -Recurse -File).Count)
      - name: Duman testi (aç, olay gönder, ekran görüntüsü al)
        shell: powershell
        run: ./windows/scripts/smoke.ps1 -Exe out/pkg/TelepAIth.exe -Hook out/hook/TelepAIthHook.exe -Out shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots
          if-no-files-found: ignore
