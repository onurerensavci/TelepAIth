name: Release

# İki yoldan çalışır:
#  1. GitHub'da Actions → Release → Run workflow (sürüm boşsa VERSION dosyası kullanılır)
#  2. Bilgisayardan v1.2.3 etiketi gönderince (scripts/release.sh)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (ör. 0.2.0). Boş bırakırsan VERSION dosyasındaki kullanılır.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü belirle
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION:-$(cat VERSION)}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Geçersiz sürüm: $V (1.2.3 biçiminde olmalı)" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: İmza sertifikasını hazırla
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Sertifika yok: yerel (ad-hoc) imza kullanılacak"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/telepaith.keychain-db"
          KCPASS="$(openssl rand -hex 12)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "TelepAIth Self Signed" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -p codesigning "$KC"
          echo "identity=TelepAIth Self Signed" >> "$GITHUB_OUTPUT"

      - name: Uygulamayı derle
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODESIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          chmod +x scripts/*.sh
          scripts/build-app.sh

      - name: Zip'le
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          cd build
          ditto -c -k --keepParent TelepAIth.app "TelepAIth-${TAG}.zip"
          # Sabit adlı kopya: Homebrew ve "son sürümü indir" bağlantıları sürüm numarası bilmeden çalışsın
          cp "TelepAIth-${TAG}.zip" TelepAIth.zip

      - name: DMG oluştur
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          rm -rf build/dmg && mkdir -p build/dmg
          ditto build/TelepAIth.app build/dmg/TelepAIth.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "TelepAIth" -srcfolder build/dmg -ov -format UDZO "build/TelepAIth-${TAG}.dmg"
          cp "build/TelepAIth-${TAG}.dmg" build/TelepAIth.dmg
          hdiutil verify "build/TelepAIth-${TAG}.dmg"

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" "build/TelepAIth-${TAG}.zip" "build/TelepAIth-${TAG}.dmg" \
            build/TelepAIth.zip build/TelepAIth.dmg \
            --target "$GITHUB_SHA" \
            --title "TelepAIth ${TAG}" \
            --generate-notes

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sürümü belirle
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION:-$(cat VERSION)}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Çekirdek testleri
        run: dotnet run --project windows/TelepAIth.Core.Tests -c Release

      - name: Uygulamayı ve hook yardımcısını yayınla
        shell: pwsh
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # Klasör düzeni (tek dosya değil): güncellemede sadece uygulama dosyaları iner
          dotnet publish windows/TelepAIth/TelepAIth.csproj -c Release -r win-x64 --self-contained true `
            -p:DebugType=none -p:Version=$env:V -o out/pkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish windows/TelepAIthHook/TelepAIthHook.csproj -c Release -r win-x64 -p:PublishAot=true `
            -p:DebugType=none -p:Version=$env:V -o out/hook
          if ($LASTEXITCODE -ne 0) {
            Write-Host "AOT olmadı, tek dosya olarak yayınlanıyor"
            dotnet publish windows/TelepAIthHook/TelepAIthHook.csproj -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -p:Version=$env:V -o out/hook
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Copy-Item out/hook/TelepAIthHook.exe out/pkg/
          Copy-Item windows/OKUBENI.txt out/pkg/
          # Çalışma zamanı kimliği: aynıysa güncelleyici küçük paketi indirir
          $rt = "{0}|{1}" -f (Get-Item out/pkg/System.Private.CoreLib.dll).VersionInfo.ProductVersion, (Get-Item out/pkg/PresentationFramework.dll).VersionInfo.ProductVersion
          Set-Content -Path out/pkg/runtime.txt -Value $rt -NoNewline -Encoding ascii
          Copy-Item out/pkg/runtime.txt Windows-TelepAIth-runtime.txt
          Write-Host "runtime: $rt"
          Compress-Archive -Path out/pkg/* -DestinationPath Windows-TelepAIth-x64.zip -Force
          # Küçük güncelleme paketi: sadece uygulamanın kendi dosyaları
          New-Item -ItemType Directory -Force out/small | Out-Null
          foreach ($f in @("TelepAIth.exe", "TelepAIth.dll", "TelepAIth.Core.dll", "TelepAIth.deps.json", "TelepAIth.runtimeconfig.json", "TelepAIthHook.exe", "OKUBENI.txt", "runtime.txt")) {
            Copy-Item (Join-Path out/pkg $f) out/small/
          }
          Compress-Archive -Path out/small/* -DestinationPath Windows-TelepAIth-x64-update.zip -Force
          Get-Item Windows-TelepAIth-*.zip, Windows-TelepAIth-runtime.txt | Select-Object Name, Length

      - name: Sürüme ekle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" Windows-TelepAIth-x64.zip Windows-TelepAIth-x64-update.zip Windows-TelepAIth-runtime.txt --clobber
